<svg xmlns="http://www.w3.org/2000/svg" width="960" height="780" viewBox="0 0 960 780" role="img" aria-labelledby="title desc"><title id="title">One extra copy, seconds of delay</title><desc id="desc">A local Connection struct caused outbox copy-on-write on each append. In-place mutation cut 1,000-client Mac loopback p95 viewer propagation from 9,173.1 ms to 186.0–200.6 ms. Bars share a linear zero baseline.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#426d63"/></marker></defs><rect width="960" height="780" rx="18" fill="#f5f1e7"/><g font-family="Helvetica, Arial, sans-serif"><text x="40" y="45" font-size="16" fill="#656960" font-weight="600">AUTONOMA / ENGINEERING NOTES</text><text x="40" y="94" font-size="34" fill="#30332e" font-weight="600">One extra copy, seconds of delay</text><text x="40" y="134" font-size="22" fill="#656960" font-weight="400">A local struct copy kept the pending array shared during every append.</text><rect x="40" y="180" width="410" height="185" rx="14" fill="#fffcf5" stroke="#d6d1c5"/><rect x="40" y="196" width="4" height="30" fill="#ad5944"/><text x="60" y="217" font-size="25" fill="#ad5944" font-weight="600">Before: copy the connection</text><text x="60" y="254" font-size="21" fill="#30332e" font-weight="400">Local connection + stored connection</text><text x="60" y="285" font-size="21" fill="#30332e" font-weight="400">Both retain the same outbox</text><text x="60" y="316" font-size="21" fill="#30332e" font-weight="400">Append → copy the pending array</text><rect x="510" y="180" width="410" height="185" rx="14" fill="#fffcf5" stroke="#d6d1c5"/><rect x="510" y="196" width="4" height="30" fill="#426d63"/><text x="530" y="217" font-size="25" fill="#426d63" font-weight="600">After: mutate in place</text><text x="530" y="254" font-size="21" fill="#30332e" font-weight="400">state.connections[id]!.outbox</text><text x="530" y="285" font-size="21" fill="#30332e" font-weight="400">Append directly to stored state</text><text x="530" y="316" font-size="21" fill="#30332e" font-weight="400">Avoid that extra retained copy</text><text x="40" y="427" font-size="24" fill="#30332e" font-weight="600">p95 viewer propagation · 1,000 loopback clients</text><text x="40" y="488" font-size="23" fill="#30332e" font-weight="600">Before</text><rect x="190" y="464" width="520" height="35" rx="4" fill="#e7e1d4" stroke="none"/><rect x="190" y="464" width="477.0012" height="35" rx="4" fill="#ad5944" stroke="none"/><text x="735" y="490" font-size="22" fill="#ad5944" font-weight="600">9,173.1 ms</text><text x="40" y="584" font-size="23" fill="#30332e" font-weight="600">After</text><rect x="190" y="560" width="520" height="35" rx="4" fill="#e7e1d4" stroke="none"/><rect x="190" y="560" width="10.4312" height="35" rx="4" fill="#426d63" stroke="none"/><text x="735" y="586" font-size="22" fill="#426d63" font-weight="600">186.0–200.6 ms</text><text x="190" y="638" font-size="18" fill="#656960" font-weight="400">0</text><text x="618" y="638" font-size="18" fill="#656960" font-weight="400">10,000 ms</text><text x="40" y="707" font-size="20" fill="#656960" font-weight="400">macOS loopback load tests. Bars show 9,173.1 ms and 200.6 ms.</text><text x="40" y="738" font-size="20" fill="#656960" font-weight="400">These measurements do not describe production WAN latency.</text></g></svg>