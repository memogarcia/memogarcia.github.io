<svg xmlns="http://www.w3.org/2000/svg" width="960" height="790" viewBox="0 0 960 790" role="img" aria-labelledby="title desc"><title id="title">What heated the phone</title><desc id="desc">Reported GPU busy rose from 60% to 87% after baked shadows raised frame rate, then fell to 27% with explicit pacing. All three bars share a zero to 100 percent scale.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#426d63"/></marker></defs><rect width="960" height="790" rx="18" fill="#f5f1e7"/><g font-family="Helvetica, Arial, sans-serif"><text x="40" y="45" font-size="16" fill="#656960" font-weight="600">AUTONOMA / ENGINEERING NOTES</text><text x="40" y="94" font-size="34" fill="#30332e" font-weight="600">What heated the phone</text><text x="40" y="133" font-size="22" fill="#656960" font-weight="400">Less work per frame can still mean more work per second.</text><text x="40" y="186" font-size="20" fill="#656960" font-weight="400">iPhone 16 · Release · September renderer tests</text><text x="40" y="235" font-size="24" fill="#30332e" font-weight="600">Real-time shadows</text><text x="40" y="266" font-size="21" fill="#656960" font-weight="400">36 fps × 16.5 ms</text><rect x="380" y="212" width="450" height="35" rx="5" fill="#e7e1d4" stroke="none"/><rect x="380" y="212" width="270.0" height="35" rx="5" fill="#ad5944" stroke="none"/><text x="846" y="239" font-size="26" fill="#ad5944" font-weight="600">60%</text><text x="40" y="348" font-size="24" fill="#30332e" font-weight="600">Baked shadow quads</text><text x="40" y="379" font-size="21" fill="#656960" font-weight="400">60 fps × 14.4 ms</text><rect x="380" y="325" width="450" height="35" rx="5" fill="#e7e1d4" stroke="none"/><rect x="380" y="325" width="391.5" height="35" rx="5" fill="#ad5944" stroke="none"/><text x="846" y="352" font-size="26" fill="#ad5944" font-weight="600">87%</text><text x="40" y="461" font-size="24" fill="#30332e" font-weight="600">Paced RealityRenderer</text><text x="40" y="492" font-size="21" fill="#656960" font-weight="400">30 fps × 8.9 ms</text><rect x="380" y="438" width="450" height="35" rx="5" fill="#e7e1d4" stroke="none"/><rect x="380" y="438" width="121.5" height="35" rx="5" fill="#426d63" stroke="none"/><text x="846" y="465" font-size="26" fill="#426d63" font-weight="600">27%</text><text x="380" y="570" font-size="18" fill="#656960" font-weight="400">0</text><text x="780" y="570" font-size="18" fill="#656960" font-weight="400">100%</text><rect x="40" y="607" width="880" height="104" rx="14" fill="#e5ece5" stroke="none"/><text x="62" y="645" font-size="26" fill="#426d63" font-weight="600">GPU busy ≈ frame rate × GPU time per frame</text><text x="62" y="680" font-size="21" fill="#30332e" font-weight="400">Baked quads reduced frame cost, but the higher frame rate ran hotter.</text><text x="40" y="752" font-size="19" fill="#656960" font-weight="400">Bars use the reported GPU-busy values; rounded timings are approximate.</text></g></svg>