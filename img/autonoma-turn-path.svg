<svg xmlns="http://www.w3.org/2000/svg" width="960" height="815" viewBox="0 0 960 815" role="img" aria-labelledby="title desc"><title id="title">Where a world turn spent its time</title><desc id="desc">The September server serialized turns around many Postgres round trips. The October server applies turns in memory and fsyncs its journal. Throughput comes from separate load tests.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#426d63"/></marker></defs><rect width="960" height="815" rx="18" fill="#f5f1e7"/><g font-family="Helvetica, Arial, sans-serif"><text x="40" y="45" font-size="16" fill="#656960" font-weight="600">AUTONOMA / ENGINEERING NOTES</text><text x="40" y="94" font-size="34" fill="#30332e" font-weight="600">Where a world turn spent its time</text><text x="40" y="134" font-size="22" fill="#656960" font-weight="400">September: each database wait holds up the next world turn.</text><rect x="40" y="180" width="260" height="150" rx="14" fill="#fffcf5" stroke="#d6d1c5"/><rect x="40" y="196" width="4" height="30" fill="#ad5944"/><text x="60" y="217" font-size="25" fill="#ad5944" font-weight="600">Queued turns</text><text x="60" y="254" font-size="21" fill="#30332e" font-weight="400">500 deep</text><text x="60" y="285" font-size="21" fill="#30332e" font-weight="400">1.6–3 s waits</text><rect x="360" y="180" width="260" height="150" rx="14" fill="#fffcf5" stroke="#d6d1c5"/><rect x="360" y="196" width="4" height="30" fill="#ad5944"/><text x="380" y="217" font-size="25" fill="#ad5944" font-weight="600">One locked turn</text><text x="380" y="254" font-size="21" fill="#30332e" font-weight="400">17 move queries</text><text x="380" y="285" font-size="21" fill="#30332e" font-weight="400">20 gather queries</text><rect x="680" y="180" width="240" height="150" rx="14" fill="#fffcf5" stroke="#d6d1c5"/><rect x="680" y="196" width="4" height="30" fill="#ad5944"/><text x="700" y="217" font-size="25" fill="#ad5944" font-weight="600">Postgres</text><text x="700" y="254" font-size="21" fill="#30332e" font-weight="400">Docker round trip</text><text x="700" y="285" font-size="21" fill="#30332e" font-weight="400">0.25–1 ms</text><path d="M300 255 H357" fill="none" stroke="#426d63" stroke-width="3" marker-end="url(#arrow)"/><path d="M620 255 H677" fill="none" stroke="#426d63" stroke-width="3" marker-end="url(#arrow)"/><text x="360" y="372" font-size="23" fill="#ad5944" font-weight="600">3.5–5 ms holding the lock per turn</text><text x="40" y="445" font-size="22" fill="#656960" font-weight="400">October: apply the turn in memory, then make it durable.</text><rect x="40" y="483" width="260" height="137" rx="14" fill="#fffcf5" stroke="#d6d1c5"/><rect x="40" y="499" width="4" height="30" fill="#426d63"/><text x="60" y="520" font-size="25" fill="#426d63" font-weight="600">Resident action</text><text x="60" y="557" font-size="21" fill="#30332e" font-weight="400">Swift server</text><rect x="360" y="483" width="260" height="137" rx="14" fill="#fffcf5" stroke="#d6d1c5"/><rect x="360" y="499" width="4" height="30" fill="#426d63"/><text x="380" y="520" font-size="25" fill="#426d63" font-weight="600">Town in memory</text><text x="380" y="557" font-size="21" fill="#30332e" font-weight="400">Apply world rules</text><rect x="680" y="483" width="240" height="137" rx="14" fill="#fffcf5" stroke="#d6d1c5"/><rect x="680" y="499" width="4" height="30" fill="#426d63"/><text x="700" y="520" font-size="25" fill="#426d63" font-weight="600">TownJournal</text><text x="700" y="557" font-size="21" fill="#30332e" font-weight="400">Append + fsync</text><path d="M300 551 H357" fill="none" stroke="#426d63" stroke-width="3" marker-end="url(#arrow)"/><path d="M620 551 H677" fill="none" stroke="#426d63" stroke-width="3" marker-end="url(#arrow)"/><text x="40" y="680" font-size="24" fill="#ad5944" font-weight="600">September Postgres: 32–41 actions/s</text><text x="40" y="720" font-size="24" fill="#426d63" font-weight="600">October Swift: 1,500–1,580 actions/s</text><text x="40" y="774" font-size="20" fill="#656960" font-weight="400">Separate Mac load tests and different implementations; not a database benchmark.</text></g></svg>