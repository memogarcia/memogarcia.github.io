{{ with site.Params.giscus }}
{{ if .enabled }}
<section class="post-comments" aria-label="Comments and reactions">
  <div class="giscus"
       data-repo="{{ .repo }}"
       data-repo-id="{{ .repo_id }}"
       data-category="{{ .category }}"
       data-category-id="{{ .category_id }}"
       data-mapping="pathname"
       data-strict="1"
       data-reactions-enabled="1"
       data-emit-metadata="0"
       data-input-position="top"
       data-lang="en"
       data-loading="lazy"></div>
  <noscript><p><a href="https://github.com/{{ .repo }}/discussions">Read or join the discussion on GitHub.</a></p></noscript>
</section>
{{ $comments := resources.Get "blog/comments.js" | fingerprint }}
<script src="{{ $comments.RelPermalink }}" defer></script>
{{ end }}
{{ end }}
