apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-scripts
  namespace: echo
data:
  script.js: |
    import http from 'k6/http';
    import { sleep } from 'k6';

    export const options = {
      vus: 200,
      duration: '3m',
      thresholds: {
        http_req_duration: ['p(95)<100', 'p(99)<250'],
        http_req_failed: ['rate<0.01'],
      },
    };

    export default function() {
      http.get('http://echo-stable.echo.svc.cluster.local/');
      sleep(0.1);
    }
