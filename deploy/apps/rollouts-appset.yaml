apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: echo-rollouts
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchExpressions:
            - key: region
              operator: In
              values:
                - us
                - eu
  template:
    metadata:
      name: 'echo-rollouts-{{.name}}'
    spec:
      project: default
      destination:
        server: '{{.server}}'
        namespace: echo
      source:
        repoURL: https://github.com/memogarcia/memogarcia.github.io
        targetRevision: master
        path: deploy/rollouts/overlays/{{.metadata.labels.region}}
      ignoreDifferences:
        - group: networking.istio.io
          kind: VirtualService
          jqPathExpressions:
            - .spec.http[].route[].weight
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - RespectIgnoreDifferences=true
