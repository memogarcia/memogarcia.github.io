apiVersion: chaos-mesh.org/v1alpha1
kind: Schedule
metadata:
  name: kill-echo
  namespace: chaos-testing
spec:
  schedule: "@every 1m"
  concurrencyPolicy: Forbid
  type: PodChaos
  podChaos:
    action: pod-kill
    mode: one
    selector:
      namespaces: [ "echo" ]
      labelSelectors:
        app: echo
