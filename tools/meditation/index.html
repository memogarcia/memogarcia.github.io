<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Meditation Timer · One Stick of Incense</title>
  <meta name="description" content="Meditation timer that burns a stick of incense instead of counting down. The stick length is the sit, the smoke rises while you sit, and a synthesized singing bowl, temple bell or tingsha rings when it burns out. Sits are logged in your browser.">
  <link rel="canonical" href="https://memo.mx/tools/meditation/">
  <meta property="og:site_name" content="Memo Garcia">
  <meta property="og:title" content="Meditation Timer">
  <meta property="og:description" content="A stick of incense for a clock. Light it, sit, and a bell rings when it burns out. Sits stay in your browser.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://memo.mx/tools/meditation/">
  <meta property="og:locale" content="en_US">
  <meta property="og:image" content="https://memo.mx/img/og-default.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Meditation Timer">
  <meta name="twitter:description" content="A stick of incense for a clock. Light it, sit, and a bell rings when it burns out.">
  <meta name="twitter:image" content="https://memo.mx/img/og-default.png">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "WebApplication",
        "@id": "https://memo.mx/tools/meditation/#app",
        "name": "Meditation Timer",
        "url": "https://memo.mx/tools/meditation/",
        "applicationCategory": "HealthApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "description": "Meditation timer that burns a stick of incense instead of counting down, with synthesized singing bowl, temple bell and tingsha bells, interval bells, room sound, and a sitting log stored only in localStorage.",
        "author": { "@type": "Person", "name": "Memo Garcia", "url": "https://memo.mx/about/" }
      },
      {
        "@type": "BreadcrumbList",
        "itemListElement": [
          { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://memo.mx/" },
          { "@type": "ListItem", "position": 2, "name": "Tools", "item": "https://memo.mx/tools/" },
          { "@type": "ListItem", "position": 3, "name": "Meditation", "item": "https://memo.mx/tools/meditation/" }
        ]
      }
    ]
  }
  </script>
  <link rel="icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <script src="/tools/theme.js"></script>
  <script src="/tools/analytics.js" defer></script>
  <link rel="stylesheet" href="/tools/meditation/meditation.css">
</head>
<body data-state="idle" data-incense="sandalwood">
  <h1 class="sr-only">Meditation Timer</h1>

  <main id="stage" class="stage">
    <div id="scene" class="scene">
      <div class="wall"></div>
      <div class="grain"></div>
      <div class="table"></div>

      <svg class="bowl" viewBox="0 0 260 124" aria-hidden="true">
        <defs>
          <linearGradient id="bowl-body" x1="0" x2="1" y1="0" y2="0">
            <stop offset="0" class="b-edge"/>
            <stop offset="0.2" class="b-mid"/>
            <stop offset="0.4" class="b-hi"/>
            <stop offset="0.68" class="b-mid"/>
            <stop offset="1" class="b-edge"/>
          </linearGradient>
          <linearGradient id="bowl-shade" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0" stop-color="#000" stop-opacity="0"/>
            <stop offset="1" stop-color="#000" stop-opacity="0.42"/>
          </linearGradient>
          <radialGradient id="ash-bed" cx="0.5" cy="0.5" r="0.62">
            <stop offset="0" class="a-hi"/>
            <stop offset="1" class="a-lo"/>
          </radialGradient>
        </defs>
        <ellipse class="bowl-shadow" cx="130" cy="115" rx="100" ry="8"/>
        <rect class="bowl-foot" x="94" y="103" width="72" height="11" rx="3"/>
        <path d="M14 22 C14 66 54 106 100 108 L160 108 C206 106 246 66 246 22 Z" fill="url(#bowl-body)"/>
        <path d="M14 22 C14 66 54 106 100 108 L160 108 C206 106 246 66 246 22 Z" fill="url(#bowl-shade)"/>
        <ellipse class="bowl-rim" cx="130" cy="22" rx="116" ry="13"/>
        <ellipse cx="130" cy="23" rx="109" ry="10.5" fill="url(#ash-bed)"/>
        <g id="flecks"></g>
        <ellipse class="ash-hole" cx="130" cy="22.6" rx="3.4" ry="1.1"/>
      </svg>

      <div id="stick" class="stick">
        <span class="wood"></span>
        <span class="tip">
          <i class="ash"></i>
          <i class="ember"></i>
          <i class="flame"></i>
        </span>
      </div>

      <div id="glow" class="glow"></div>
      <canvas id="smoke" class="smoke" aria-hidden="true"></canvas>

      <button id="light" class="light" type="button" aria-label="Light the incense"></button>
      <p id="hint" class="hint" aria-hidden="true">Light the stick.</p>
    </div>
    <div class="vignette"></div>
  </main>

  <header class="chrome chrome-top">
    <a class="back" href="/tools/">← Tools</a>
    <button class="theme-control" type="button" aria-label="Change theme" hidden>
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <g class="theme-icon-device"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/></g>
        <g class="theme-icon-light"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></g>
        <g class="theme-icon-dark"><path d="M20.5 13.2A8.5 8.5 0 0 1 10.8 3.5a8.5 8.5 0 1 0 9.7 9.7Z"/></g>
      </svg>
    </button>
  </header>

  <footer class="chrome chrome-bottom">
    <span id="status" class="status">10 min</span>
    <button id="toggle-btn" type="button">Light</button>
    <button id="end-btn" type="button" hidden>End sit</button>
    <button id="sound-btn" type="button" aria-pressed="true">Sound on</button>
    <button id="incense-btn" type="button" aria-expanded="false" aria-controls="panel-incense">Incense</button>
    <button id="bell-btn" type="button" aria-expanded="false" aria-controls="panel-bell">Bell</button>
    <button id="log-btn" type="button" aria-expanded="false" aria-controls="panel-log">Log</button>

    <div id="panel-incense" class="panel" hidden>
      <div class="pref">
        <label for="len">Length</label>
        <input id="len" type="range" min="1" max="120" step="1" value="10" aria-describedby="len-out">
        <output id="len-out" for="len">10 min</output>
      </div>
      <div class="pref" role="group" aria-label="Stick length presets">
        <span>Stick</span>
        <div class="seg cols-6">
          <button class="pick-min" type="button" data-min="5" aria-pressed="false">5</button>
          <button class="pick-min" type="button" data-min="10" aria-pressed="true">10</button>
          <button class="pick-min" type="button" data-min="20" aria-pressed="false">20</button>
          <button class="pick-min" type="button" data-min="30" aria-pressed="false">30</button>
          <button class="pick-min" type="button" data-min="45" aria-pressed="false">45</button>
          <button class="pick-min" type="button" data-min="0" aria-pressed="false" title="No fixed end. A new stick lights every 30 minutes.">Open</button>
        </div>
      </div>
      <div class="pref" role="group" aria-label="Incense">
        <span>Incense</span>
        <div class="seg cols-2">
          <button class="pick-incense" type="button" data-incense="sandalwood" aria-pressed="true">Sandalwood</button>
          <button class="pick-incense" type="button" data-incense="aloeswood" aria-pressed="false">Aloeswood</button>
          <button class="pick-incense" type="button" data-incense="hinoki" aria-pressed="false">Hinoki</button>
          <button class="pick-incense" type="button" data-incense="plum" aria-pressed="false">Plum</button>
        </div>
      </div>
      <div class="pref" role="group" aria-label="Flame before the sit starts">
        <span>Settle</span>
        <div class="seg cols-4">
          <button class="pick-prep" type="button" data-prep="0" aria-pressed="true">Off</button>
          <button class="pick-prep" type="button" data-prep="5" aria-pressed="false">5 s</button>
          <button class="pick-prep" type="button" data-prep="10" aria-pressed="false">10 s</button>
          <button class="pick-prep" type="button" data-prep="15" aria-pressed="false">15 s</button>
        </div>
      </div>
    </div>

    <div id="panel-bell" class="panel" hidden>
      <div class="pref" role="group" aria-label="Bell">
        <span>Bell</span>
        <div class="seg cols-4">
          <button class="pick-bell" type="button" data-bell="bowl" aria-pressed="true">Bowl</button>
          <button class="pick-bell" type="button" data-bell="temple" aria-pressed="false">Temple</button>
          <button class="pick-bell" type="button" data-bell="tingsha" aria-pressed="false">Tingsha</button>
          <button class="pick-bell" type="button" data-bell="off" aria-pressed="false">None</button>
        </div>
      </div>
      <div class="pref" role="group" aria-label="Opening bell">
        <span>Start</span>
        <div class="seg cols-2">
          <button class="pick-start" type="button" data-start="1" aria-pressed="true">1 bell</button>
          <button class="pick-start" type="button" data-start="0" aria-pressed="false">Silent</button>
        </div>
      </div>
      <div class="pref" role="group" aria-label="Closing bells">
        <span>End</span>
        <div class="seg cols-2">
          <button class="pick-end" type="button" data-end="1" aria-pressed="false">1 bell</button>
          <button class="pick-end" type="button" data-end="3" aria-pressed="true">3 bells</button>
        </div>
      </div>
      <div class="pref" role="group" aria-label="Interval bell">
        <span>Interval</span>
        <div class="seg cols-4">
          <button class="pick-interval" type="button" data-interval="off" aria-pressed="true">Off</button>
          <button class="pick-interval" type="button" data-interval="5" aria-pressed="false">5 min</button>
          <button class="pick-interval" type="button" data-interval="10" aria-pressed="false">10 min</button>
          <button class="pick-interval" type="button" data-interval="half" aria-pressed="false">Half</button>
        </div>
      </div>
      <div class="pref" role="group" aria-label="Room sound">
        <span>Room</span>
        <div class="seg cols-4">
          <button class="pick-ambient" type="button" data-ambient="off" aria-pressed="true">Quiet</button>
          <button class="pick-ambient" type="button" data-ambient="rain" aria-pressed="false">Rain</button>
          <button class="pick-ambient" type="button" data-ambient="wind" aria-pressed="false">Wind</button>
          <button class="pick-ambient" type="button" data-ambient="stream" aria-pressed="false">Stream</button>
        </div>
      </div>
      <div class="pref">
        <label for="volume">Volume</label>
        <input id="volume" type="range" min="0" max="100" step="5" value="70" aria-describedby="volume-out">
        <output id="volume-out" for="volume">70%</output>
      </div>
    </div>

    <div id="panel-log" class="panel panel-log" hidden>
      <p id="stats" class="stats">0 sits today · 0 day streak</p>
      <div id="note-row" class="note-row" hidden>
        <label class="sr-only" for="note-input">Note for the last sit</label>
        <input id="note-input" class="note-input" type="text" maxlength="120" autocomplete="off" placeholder="Note for the last sit">
      </div>
      <p id="log-empty" class="log-empty">Sits of a minute or more appear here. They stay in this browser.</p>
      <ul id="log-list" class="log-list" hidden></ul>
      <button id="clear-btn" class="clear-btn" type="button" hidden>Clear log</button>
    </div>
  </footer>

  <p id="live" class="sr-only" aria-live="polite"></p>

  <script src="/tools/meditation/meditation.js"></script>
</body>
</html>
