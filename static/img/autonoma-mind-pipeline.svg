<svg xmlns="http://www.w3.org/2000/svg" width="960" height="780" viewBox="0 0 960 780" role="img" aria-labelledby="title desc"><title id="title">A small model with a bounded job</title><desc id="desc">Code offers legal activities, the on-device model chooses structured building parameters, templates expand the geometry, and the executor builds. Measured one-mind plan time fell from 6.2 to 2.4 seconds.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#426d63"/></marker></defs><rect width="960" height="780" rx="18" fill="#f5f1e7"/><g font-family="Helvetica, Arial, sans-serif"><text x="40" y="45" font-size="16" fill="#656960" font-weight="600">AUTONOMA / ENGINEERING NOTES</text><text x="40" y="94" font-size="34" fill="#30332e" font-weight="600">A small model with a bounded job</text><text x="40" y="133" font-size="22" fill="#656960" font-weight="400">Give the model choices. Let code shape and validate the building.</text><rect x="40" y="179" width="390" height="162" rx="14" fill="#fffcf5" stroke="#d6d1c5"/><rect x="40" y="195" width="4" height="30" fill="#426d63"/><text x="60" y="216" font-size="25" fill="#426d63" font-weight="600">1 / Offer legal options</text><text x="60" y="253" font-size="21" fill="#30332e" font-weight="400">Perception, aim and suggestion</text><text x="60" y="284" font-size="21" fill="#30332e" font-weight="400">Eight options, rotated over time</text><rect x="530" y="179" width="390" height="162" rx="14" fill="#fffcf5" stroke="#d6d1c5"/><rect x="530" y="195" width="4" height="30" fill="#80628d"/><text x="550" y="216" font-size="25" fill="#80628d" font-weight="600">2 / Model picks a plan</text><text x="550" y="253" font-size="21" fill="#30332e" font-weight="400">Branched generation schema</text><text x="550" y="284" font-size="21" fill="#30332e" font-weight="400">Type, name, size, paper, facing</text><path d="M430 260 H527" fill="none" stroke="#426d63" stroke-width="3" marker-end="url(#arrow)"/><rect x="530" y="419" width="390" height="162" rx="14" fill="#fffcf5" stroke="#d6d1c5"/><rect x="530" y="435" width="4" height="30" fill="#426d63"/><text x="550" y="456" font-size="25" fill="#426d63" font-weight="600">3 / Code expands the shape</text><text x="550" y="493" font-size="21" fill="#30332e" font-weight="400">Templates + PlanExpansion</text><text x="550" y="524" font-size="21" fill="#30332e" font-weight="400">SiteFinder checks the site</text><path d="M725 341 V416" fill="none" stroke="#426d63" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="419" width="390" height="162" rx="14" fill="#fffcf5" stroke="#d6d1c5"/><rect x="40" y="435" width="4" height="30" fill="#426d63"/><text x="60" y="456" font-size="25" fill="#426d63" font-weight="600">4 / Executor builds</text><text x="60" y="493" font-size="21" fill="#30332e" font-weight="400">Walk to the site; place blocks</text><text x="60" y="524" font-size="21" fill="#30332e" font-weight="400">Observe the town, then choose again</text><path d="M530 500 H433" fill="none" stroke="#426d63" stroke-width="3" marker-end="url(#arrow)"/><path d="M235 419 V344" fill="none" stroke="#426d63" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arrow)"/><rect x="40" y="625" width="880" height="112" rx="14" fill="#e9e2ed" stroke="none"/><text x="62" y="669" font-size="29" fill="#80628d" font-weight="600">Measured plan time: 6.2 s → 2.4 s</text><text x="62" y="707" font-size="21" fill="#30332e" font-weight="400">iPhone 16 · one mind · earlier plan vs. guided building choices</text></g></svg>