<svg xmlns="http://www.w3.org/2000/svg" width="960" height="775" viewBox="0 0 960 775" role="img" aria-labelledby="title desc"><title id="title">One town, minds on each device</title><desc id="desc">iPhone and Mac clients send actions to the Swift authority and receive numbered changes. The server journals mutations before replying and runs no language models.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#426d63"/></marker></defs><rect width="960" height="775" rx="18" fill="#f5f1e7"/><g font-family="Helvetica, Arial, sans-serif"><text x="40" y="45" font-size="16" fill="#656960" font-weight="600">AUTONOMA / ENGINEERING NOTES</text><text x="40" y="94" font-size="34" fill="#30332e" font-weight="600">One town, minds on each device</text><text x="40" y="132" font-size="22" fill="#656960" font-weight="400">Resident minds live on devices. One server orders shared changes.</text><rect x="40" y="170" width="380" height="210" rx="14" fill="#fffcf5" stroke="#d6d1c5"/><rect x="40" y="186" width="4" height="30" fill="#426d63"/><text x="60" y="207" font-size="25" fill="#426d63" font-weight="600">iPhone</text><text x="60" y="244" font-size="21" fill="#30332e" font-weight="400">Foundation Models → plan</text><text x="60" y="275" font-size="21" fill="#30332e" font-weight="400">Executor → walk and place</text><text x="60" y="306" font-size="21" fill="#30332e" font-weight="400">Town replica → Metal renderer</text><rect x="40" y="440" width="380" height="150" rx="14" fill="#fffcf5" stroke="#d6d1c5"/><rect x="40" y="456" width="4" height="30" fill="#426d63"/><text x="60" y="477" font-size="25" fill="#426d63" font-weight="600">Always-on Mac</text><text x="60" y="514" font-size="21" fill="#30332e" font-weight="400">Founders use the same mind code</text><text x="60" y="545" font-size="21" fill="#30332e" font-weight="400">Connect as resident clients</text><rect x="530" y="240" width="390" height="245" rx="14" fill="#fffcf5" stroke="#d6d1c5"/><rect x="530" y="256" width="4" height="30" fill="#426d63"/><text x="550" y="277" font-size="25" fill="#426d63" font-weight="600">Swift world server</text><text x="550" y="314" font-size="21" fill="#30332e" font-weight="400">Hummingbird / WebSocket</text><text x="550" y="345" font-size="21" fill="#30332e" font-weight="400">Town authority in memory</text><text x="550" y="376" font-size="21" fill="#30332e" font-weight="400">Check contested actions</text><text x="550" y="407" font-size="21" fill="#30332e" font-weight="400">Assign TownChange sequence</text><path d="M420 270 H527" fill="none" stroke="#426d63" stroke-width="3" marker-end="url(#arrow)"/><path d="M530 350 H423" fill="none" stroke="#426d63" stroke-width="3" marker-end="url(#arrow)"/><text x="436" y="250" font-size="17" fill="#656960" font-weight="400">actions</text><text x="434" y="378" font-size="17" fill="#656960" font-weight="400">changes</text><path d="M420 500 H475 V445 H527" fill="none" stroke="#426d63" stroke-width="3" marker-end="url(#arrow)"/><rect x="530" y="550" width="390" height="135" rx="14" fill="#fffcf5" stroke="#d6d1c5"/><rect x="530" y="566" width="4" height="30" fill="#426d63"/><text x="550" y="587" font-size="25" fill="#426d63" font-weight="600">TownJournal</text><text x="550" y="624" font-size="21" fill="#30332e" font-weight="400">Append + SHA-256 + fsync</text><text x="550" y="655" font-size="21" fill="#30332e" font-weight="400">Durable before replies</text><path d="M725 485 V547" fill="none" stroke="#426d63" stroke-width="3" marker-end="url(#arrow)"/><text x="40" y="650" font-size="22" fill="#656960" font-weight="400">AutonomaKit shares world rules,</text><text x="40" y="681" font-size="22" fill="#656960" font-weight="400">messages and resident behavior.</text><text x="40" y="739" font-size="21" fill="#656960" font-weight="400">Seeded terrain is rebuilt locally; edited chunks carry the shared state.</text></g></svg>